name: Deploy Maths Bodhi Backend Staging

on:
  push:
    branches: [staging]
    paths:
      - "ib-igcse-tutors/backend/**"
      - "ib-igcse-tutors/frontend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  build:
    name: Build Backend and Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ib-igcse-tutors/backend
        run: npm ci

      - name: Build backend
        working-directory: ib-igcse-tutors/backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: ib-igcse-tutors/frontend
        run: npm ci

      - name: Build frontend
        working-directory: ib-igcse-tutors/frontend
        env:
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_PROXY_TARGET: ${{ secrets.VITE_API_PROXY_TARGET }}
        run: npm run build

  deploy-backend:
    name: Deploy Backend to CloudPanel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy backend over SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd ${{ secrets.SERVER_PROJECT_PATH }}

            git fetch origin
            git checkout staging
            git reset --hard origin/staging

            cd ib-igcse-tutors/backend

            npm ci
            npm run build
            npm run db:check

            pm2 restart maths-bodhi-backend || pm2 start dist/server.js --name maths-bodhi-backend
            pm2 save
