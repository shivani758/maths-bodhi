name: Deploy Maths Bodhi Staging

on:
  push:
    branches: [staging]
    paths:
      - "ib-igcse-tutors/backend/**"
      - "ib-igcse-tutors/frontend/**"
      - "scripts/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: maths-bodhi-staging-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build Frontend And Backend
    runs-on: ubuntu-latest

    env:
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_API_PROXY_TARGET: ${{ secrets.VITE_API_PROXY_TARGET }}
      VITE_TWITTER_SITE: ${{ secrets.VITE_TWITTER_SITE }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        working-directory: ib-igcse-tutors/backend
        run: npm ci

      - name: Build backend
        working-directory: ib-igcse-tutors/backend
        run: npm run build

      - name: Install frontend dependencies
        working-directory: ib-igcse-tutors/frontend
        run: npm ci

      - name: Build frontend
        working-directory: ib-igcse-tutors/frontend
        run: npm run build

  deploy:
    name: Deploy Full Project To CloudPanel
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SESSION_COOKIE_NAME: ${{ secrets.SESSION_COOKIE_NAME }}
          SESSION_COOKIE_SAME_SITE: ${{ secrets.SESSION_COOKIE_SAME_SITE }}
          SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
          SESSION_COOKIE_DOMAIN: ${{ secrets.SESSION_COOKIE_DOMAIN }}
          ADMIN_SEED_NAME: ${{ secrets.ADMIN_SEED_NAME }}
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          PORT: ${{ secrets.PORT }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_API_PROXY_TARGET: ${{ secrets.VITE_API_PROXY_TARGET }}
          VITE_TWITTER_SITE: ${{ secrets.VITE_TWITTER_SITE }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          port: ${{ secrets.SSH_PORT }}
          password: ${{ secrets.SSH_PASSWORD }}
          command_timeout: 30m
          envs: DATABASE_URL,DB_HOST,DB_PORT,DB_NAME,DB_USER,DB_PASSWORD,FRONTEND_ORIGIN,SESSION_SECRET,JWT_SECRET,SESSION_COOKIE_NAME,SESSION_COOKIE_SAME_SITE,SESSION_COOKIE_SECURE,SESSION_COOKIE_DOMAIN,ADMIN_SEED_NAME,ADMIN_SEED_EMAIL,ADMIN_SEED_PASSWORD,PORT,VITE_SITE_URL,VITE_API_URL,VITE_API_PROXY_TARGET,VITE_TWITTER_SITE
          script: |
            set -eo pipefail

            WEB_ROOT="/home/mathsbodhi_user/htdocs/www.mathsbodhi.in"
            APP_DIR="/home/mathsbodhi_user/apps/maths-bodhi"
            REPO_URL="https://github.com/shivani758/maths-bodhi.git"
            BRANCH="staging"
            BACKEND_DIR="ib-igcse-tutors/backend"
            FRONTEND_DIR="ib-igcse-tutors/frontend"
            PM2_PROCESS="maths-bodhi-backend"
            BACKEND_PORT="${PORT:-10000}"
            HEALTH_URL="http://127.0.0.1:${BACKEND_PORT}/api/health"

            require_env() {
              for name in "$@"; do
                eval "value=\${$name:-}"
                if [ -z "$value" ]; then
                  echo "Missing required GitHub secret: $name"
                  exit 1
                fi
              done
            }

            load_node_runtime() {
              export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"

              if [ -s "$NVM_DIR/nvm.sh" ]; then
                . "$NVM_DIR/nvm.sh"
                nvm use 20 >/dev/null 2>&1 || nvm use --lts >/dev/null 2>&1 || true
              fi

              if ! command -v npm >/dev/null 2>&1; then
                for node_bin in "$HOME/.nvm/versions/node"/*/bin "$HOME/.local/bin" /usr/local/bin /usr/bin /opt/nodejs/bin /opt/node/*/bin; do
                  if [ -x "$node_bin/npm" ]; then
                    export PATH="$node_bin:$PATH"
                    break
                  fi
                done
              fi

              if ! command -v npm >/dev/null 2>&1; then
                if [ ! -s "$NVM_DIR/nvm.sh" ]; then
                  if ! command -v curl >/dev/null 2>&1; then
                    echo "Node.js/npm is missing and curl is unavailable to install nvm."
                    exit 127
                  fi

                  curl -fsSL https://raw.githubusercontent.com/nvm-sh/nvm/v0.40.1/install.sh | bash
                  . "$NVM_DIR/nvm.sh"
                fi

                nvm install 20
                nvm use 20
              fi

              if ! command -v node >/dev/null 2>&1 || ! command -v npm >/dev/null 2>&1; then
                echo "Node.js/npm is still unavailable after loading NVM."
                exit 127
              fi

              if ! command -v pm2 >/dev/null 2>&1; then
                npm install -g pm2
              fi

              node --version
              npm --version
              pm2 --version
            }

            require_env DATABASE_URL DB_PASSWORD FRONTEND_ORIGIN SESSION_SECRET JWT_SECRET ADMIN_SEED_EMAIL ADMIN_SEED_PASSWORD VITE_SITE_URL
            load_node_runtime

            mkdir -p "$WEB_ROOT" "$APP_DIR"
            cd "$APP_DIR"

            if [ ! -d ".git" ]; then
              git clone --branch "$BRANCH" --single-branch "$REPO_URL" .
            else
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            cd "$APP_DIR/$BACKEND_DIR"

            cat > .env <<EOF
            NODE_ENV=production
            HOST=0.0.0.0
            PORT=${BACKEND_PORT}
            DATABASE_URL=${DATABASE_URL}
            DB_HOST=${DB_HOST}
            DB_PORT=${DB_PORT:-5432}
            DB_NAME=${DB_NAME}
            DB_USER=${DB_USER}
            DB_PASSWORD=${DB_PASSWORD}
            FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
            SESSION_SECRET=${SESSION_SECRET}
            JWT_SECRET=${JWT_SECRET}
            SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME:-maths_bodhi_admin_sid}
            SESSION_COOKIE_SAME_SITE=${SESSION_COOKIE_SAME_SITE:-lax}
            SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE:-true}
            SESSION_COOKIE_DOMAIN=${SESSION_COOKIE_DOMAIN:-}
            ADMIN_SEED_NAME=${ADMIN_SEED_NAME}
            ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL}
            ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD}
            EOF

            chmod 600 .env
            npm ci
            npm run build
            npm run db:migrate
            npm run db:check
            npm run seed

            if pm2 describe "$PM2_PROCESS" >/dev/null 2>&1; then
              pm2 restart "$PM2_PROCESS" --update-env
            else
              pm2 start dist/server.js --name "$PM2_PROCESS" --update-env
            fi

            pm2 save

            cd "$APP_DIR/$FRONTEND_DIR"

            cat > .env.production <<EOF
            VITE_SITE_URL=${VITE_SITE_URL}
            VITE_API_URL=${VITE_API_URL}
            VITE_API_PROXY_TARGET=${VITE_API_PROXY_TARGET}
            VITE_TWITTER_SITE=${VITE_TWITTER_SITE}
            EOF

            chmod 600 .env.production
            npm ci
            npm run build

            if command -v rsync >/dev/null 2>&1; then
              rsync -a --delete --exclude ".well-known" dist/ "$WEB_ROOT/"
            else
              rm -rf "$WEB_ROOT/.git" "$WEB_ROOT/.github" "$WEB_ROOT/ib-igcse-tutors" "$WEB_ROOT/scripts" "$WEB_ROOT/README.md"
              rm -rf "$WEB_ROOT/assets" "$WEB_ROOT/images" "$WEB_ROOT/index.html" "$WEB_ROOT/favicon.svg" "$WEB_ROOT/icons.svg" "$WEB_ROOT/robots.txt" "$WEB_ROOT/sitemap.xml"
              cp -a dist/. "$WEB_ROOT/"
            fi

            curl -f "$HEALTH_URL"
