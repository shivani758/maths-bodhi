name: Build Maths Bodhi

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    name: Backend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ib-igcse-tutors/backend

    env:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: ${{ secrets.PORT }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DB_HOST: ${{ secrets.DB_HOST }}
      DB_PORT: ${{ secrets.DB_PORT }}
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      JWT_SECRET: ${{ secrets.JWT_SECRET }}
      ADMIN_SEED_NAME: ${{ secrets.ADMIN_SEED_NAME }}
      ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
      ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
      SESSION_COOKIE_NAME: maths_bodhi_admin_sid
      SESSION_COOKIE_SAME_SITE: lax
      SESSION_COOKIE_SECURE: "true"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ib-igcse-tutors/backend/package-lock.json

      - name: Install backend dependencies
        run: npm ci

      - name: Build backend
        run: npm run build

  frontend:
    name: Frontend Build
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: ib-igcse-tutors/frontend

    env:
      VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
      VITE_API_URL: ${{ secrets.VITE_API_URL }}
      VITE_API_PROXY_TARGET: ${{ secrets.VITE_API_PROXY_TARGET }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ib-igcse-tutors/frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
