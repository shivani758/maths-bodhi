name: Deploy Maths Bodhi to CloudPanel

on:
  push:
    branches:
      - staging
      - main
  # Lets a deploy be re-run from the Actions tab without inventing a commit —
  # useful when a run failed on server state rather than on the code.
  workflow_dispatch:

concurrency:
  group: cloudpanel-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      APP_SUBDIR: ib-igcse-tutors
      BACKEND_SUBDIR: ib-igcse-tutors/backend
      FRONTEND_SUBDIR: ib-igcse-tutors/frontend
      PM2_PROCESS_NAME: maths-bodhi-backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        shell: bash
        env:
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_NAME: ${{ secrets.ADMIN_SEED_NAME }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          PORT: ${{ secrets.PORT }}
          SERVER_PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH }}
          SESSION_COOKIE_NAME: ${{ secrets.SESSION_COOKIE_NAME }}
          SESSION_COOKIE_SAME_SITE: ${{ secrets.SESSION_COOKIE_SAME_SITE }}
          SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: |
          set -euo pipefail

          missing=0
          required_secrets=(
            ADMIN_SEED_EMAIL
            ADMIN_SEED_NAME
            ADMIN_SEED_PASSWORD
            DATABASE_URL
            DB_HOST
            DB_NAME
            DB_PASSWORD
            DB_PORT
            DB_USER
            FRONTEND_ORIGIN
            JWT_SECRET
            NODE_ENV
            PORT
            SERVER_PROJECT_PATH
            SESSION_COOKIE_NAME
            SESSION_COOKIE_SAME_SITE
            SESSION_COOKIE_SECURE
            SESSION_SECRET
            SSH_HOST
            SSH_PASSWORD
            SSH_PORT
            SSH_USER
            VITE_SITE_URL
          )

          for secret_name in "${required_secrets[@]}"; do
            if [ -z "${!secret_name:-}" ]; then
              echo "::error::Missing repository secret: ${secret_name}"
              missing=1
            fi
          done

          exit "${missing}"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.19.4
          cache: npm
          cache-dependency-path: |
            ib-igcse-tutors/backend/package-lock.json
            ib-igcse-tutors/frontend/package-lock.json

      - name: Build backend
        shell: bash
        working-directory: ib-igcse-tutors/backend
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Build frontend
        shell: bash
        working-directory: ib-igcse-tutors/frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: |
          set -euo pipefail
          npm ci
          npm run build

      - name: Prepare deployment package and env files
        shell: bash
        env:
          ADMIN_SEED_EMAIL: ${{ secrets.ADMIN_SEED_EMAIL }}
          ADMIN_SEED_NAME: ${{ secrets.ADMIN_SEED_NAME }}
          ADMIN_SEED_PASSWORD: ${{ secrets.ADMIN_SEED_PASSWORD }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_NAME: ${{ secrets.DB_NAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          FRONTEND_ORIGIN: ${{ secrets.FRONTEND_ORIGIN }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          NODE_ENV: ${{ secrets.NODE_ENV }}
          PORT: ${{ secrets.PORT }}
          SESSION_COOKIE_NAME: ${{ secrets.SESSION_COOKIE_NAME }}
          SESSION_COOKIE_SAME_SITE: ${{ secrets.SESSION_COOKIE_SAME_SITE }}
          SESSION_COOKIE_SECURE: ${{ secrets.SESSION_COOKIE_SECURE }}
          SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_SITE_URL: ${{ secrets.VITE_SITE_URL }}
        run: |
          set -euo pipefail
          mkdir -p .deploy

          cat > .deploy/backend.env <<EOF
          NODE_ENV=${NODE_ENV:-production}
          HOST=0.0.0.0
          PORT=${PORT}
          DATABASE_URL=${DATABASE_URL}
          DB_HOST=${DB_HOST}
          DB_PORT=${DB_PORT}
          DB_NAME=${DB_NAME}
          DB_USER=${DB_USER}
          DB_PASSWORD=${DB_PASSWORD}
          SESSION_SECRET=${SESSION_SECRET}
          JWT_SECRET=${JWT_SECRET}
          SESSION_COOKIE_NAME=${SESSION_COOKIE_NAME}
          SESSION_COOKIE_SAME_SITE=${SESSION_COOKIE_SAME_SITE}
          SESSION_COOKIE_SECURE=${SESSION_COOKIE_SECURE}
          SESSION_COOKIE_DOMAIN=
          FRONTEND_ORIGIN=${FRONTEND_ORIGIN}
          ADMIN_SEED_NAME=${ADMIN_SEED_NAME}
          ADMIN_SEED_EMAIL=${ADMIN_SEED_EMAIL}
          ADMIN_SEED_PASSWORD=${ADMIN_SEED_PASSWORD}
          EOF

          cat > .deploy/frontend.env.production <<EOF
          VITE_API_URL=${VITE_API_URL:-}
          VITE_SITE_URL=${VITE_SITE_URL}
          EOF

          tar \
            --exclude='./.git' \
            --exclude='./.deploy' \
            --exclude='./ib-igcse-tutors/backend/node_modules' \
            --exclude='./ib-igcse-tutors/frontend/node_modules' \
            -czf .deploy/source.tgz .

      - name: Install SSH tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y sshpass

      - name: Upload package to CloudPanel
        shell: bash
        env:
          SERVER_PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          # Strip whitespace here too. This step runs before the deploy script and
          # creates the directory itself, so leaving it on the raw value would
          # recreate the newline-suffixed folder even with the deploy script fixed.
          APP_DIR="$(printf '%s' "${SERVER_PROJECT_PATH}" | tr -d '[:space:]')"

          if [ -z "${APP_DIR}" ] || [ "${APP_DIR}" = "/" ]; then
            echo "::error::SERVER_PROJECT_PATH is empty or unsafe."
            exit 1
          fi

          sshpass -p "${SSH_PASSWORD}" ssh \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${SSH_USER}@${SSH_HOST}" \
            "mkdir -p '${APP_DIR}/.deploy'"

          sshpass -p "${SSH_PASSWORD}" scp \
            -P "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            .deploy/source.tgz \
            .deploy/backend.env \
            .deploy/frontend.env.production \
            "${SSH_USER}@${SSH_HOST}:${APP_DIR}/.deploy/"

      - name: Deploy on CloudPanel
        shell: bash
        env:
          SERVER_PROJECT_PATH: ${{ secrets.SERVER_PROJECT_PATH }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
        run: |
          set -euo pipefail

          remote_script="$(mktemp)"
          cat > "${remote_script}" <<'REMOTE_SCRIPT'
          set -euo pipefail

          # Strip every whitespace character, newlines included.
          #
          # This is the guard for the bug that took the site down on 24 July 2026:
          # SERVER_PROJECT_PATH was saved in GitHub with an invisible trailing
          # newline, so "mkdir -p" created a directory whose name literally ended
          # in \n. Every path built from it inherited the newline, the backend was
          # started from that folder, and the built frontend was written somewhere
          # nginx does not serve. Two look-alike folders, three weeks of deploys
          # that reached nobody. Pasting a value into GitHub's secret box picks up
          # a trailing newline very easily, so this strips it rather than trusting
          # the value to be clean.
          APP_DIR="$(printf '%s' "${SERVER_PROJECT_PATH}" | tr -d '[:space:]')"
          SERVED_ROOT="${SERVED_ROOT:-/home/mathsbodhi/htdocs/www.mathsbodhi.in}"
          APP_SUBDIR="ib-igcse-tutors"
          BACKEND_DIR="${APP_DIR}/${APP_SUBDIR}/backend"
          FRONTEND_DIR="${APP_DIR}/${APP_SUBDIR}/frontend"
          PM2_PROCESS_NAME="maths-bodhi-backend"

          if [ -z "${APP_DIR}" ] || [ "${APP_DIR}" = "/" ]; then
            echo "SERVER_PROJECT_PATH is empty or unsafe: '${APP_DIR}'"
            exit 1
          fi

          # The source checkout must never land in the web root — it would publish
          # the whole repository, .deploy/backend.env and its secrets included.
          if [ "${APP_DIR}" = "${SERVED_ROOT}" ]; then
            echo "SERVER_PROJECT_PATH must not be the served web root (${SERVED_ROOT})."
            echo "Point it at a working directory outside htdocs."
            exit 1
          fi

          mkdir -p "${APP_DIR}"
          tar -xzf "${APP_DIR}/.deploy/source.tgz" -C "${APP_DIR}"
          ln -sfn "${APP_DIR}/${APP_SUBDIR}" "${APP_DIR}/current"

          install -m 600 "${APP_DIR}/.deploy/backend.env" "${BACKEND_DIR}/.env"
          install -m 600 "${APP_DIR}/.deploy/frontend.env.production" "${FRONTEND_DIR}/.env.production"

          export NVM_DIR="${NVM_DIR:-$HOME/.nvm}"
          if [ -s "${NVM_DIR}/nvm.sh" ]; then
            . "${NVM_DIR}/nvm.sh"
          fi
          if command -v nvm >/dev/null 2>&1; then
            nvm use 22 >/dev/null 2>&1 || nvm use 20 >/dev/null 2>&1 || true
          fi

          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 20 || (major === 20 && minor < 19)) { console.error(`Node.js ${process.versions.node} is too old. Use Node.js 22 LTS or >=20.19.0.`); process.exit(1); }'
          command -v npm >/dev/null
          command -v pm2 >/dev/null 2>&1 || npm install pm2@latest -g

          cd "${BACKEND_DIR}"
          npm ci
          npm run build
          npm run db:init
          npm run db:check
          FRONTEND_SOURCE_DIR="${FRONTEND_DIR}/src" npm run seed

          cd "${FRONTEND_DIR}"
          npm ci
          npm run build
          # Tolerate failure: these paths belong to whoever created them, and a
          # chmod on a directory this user does not own aborts the deploy under
          # "set -e" without changing anything that matters.
          chmod 755 "${APP_DIR}" "${APP_DIR}/${APP_SUBDIR}" "${FRONTEND_DIR}" "${FRONTEND_DIR}/dist" 2>/dev/null || true
          find "${FRONTEND_DIR}/dist" -type d -exec chmod 755 {} \;
          find "${FRONTEND_DIR}/dist" -type f -exec chmod 644 {} \;

          # Publish the build to the folder nginx actually serves.
          #
          # This step did not exist before 27 July 2026, which is the real reason
          # the live site sat on a 6 July build for three weeks. The deploy built
          # correctly every time and then stopped, leaving the result in a folder
          # nobody serves. It was patched by hand twice (11 July, 27 July); the
          # note written the first time said the copy has to happen on every
          # deploy, and nothing automated it. This is that automation.
          if [ ! -f "${FRONTEND_DIR}/dist/index.html" ]; then
            echo "Build produced no index.html — refusing to publish."
            exit 1
          fi

          mkdir -p "${SERVED_ROOT}"

          # Deliberately -rlt and NOT -a.
          #
          # The served root belongs to the site user (mathsbodhi) while this
          # deploy runs as mathsbodhi_user — group write is what lets it publish
          # at all. "-a" implies -p -o -g, so rsync would try to change the
          # permissions and ownership of files it does not own, which fails with
          # "Operation not permitted" and takes the whole deploy down under
          # "set -e". Same reason there is no chmod loop over the served root
          # here: --chmod sets the mode as each file is written instead, which
          # only touches files rsync itself creates.
          #
          # Two passes so the site is never asking for an asset that has not
          # landed yet: everything except index.html first, index.html last.
          # -O (--omit-dir-times) matters as much as the rest. Without it, -t
          # tries to set the modification time on directories that already exist
          # in the served root — ".", "assets", "images" — and those belong to
          # mathsbodhi, not to the deploy user. rsync reports "failed to set
          # times ... Operation not permitted" and exits 23, which fails the
          # deploy even though every file copied correctly.
          rsync -rltO --delete --chmod=D775,F664 --no-perms --no-owner --no-group \
            --exclude="index.html" \
            "${FRONTEND_DIR}/dist/" "${SERVED_ROOT}/"

          cat "${FRONTEND_DIR}/dist/index.html" > "${SERVED_ROOT}/index.html"

          echo "Published $(find "${SERVED_ROOT}" -type f | wc -l) files to ${SERVED_ROOT}"

          cd "${BACKEND_DIR}"
          npm prune --omit=dev
          rm -rf "${FRONTEND_DIR}/node_modules"

          cat > "${BACKEND_DIR}/ecosystem.config.cjs" <<'EOF'
          module.exports = {
            apps: [
              {
                name: "maths-bodhi-backend",
                cwd: __dirname,
                script: "dist/server.js",
                exec_mode: "fork",
                instances: 1,
                autorestart: true,
                max_memory_restart: "512M",
                env: {
                  NODE_ENV: "production",
                },
              },
            ],
          };
          EOF

          pm2 startOrReload "${BACKEND_DIR}/ecosystem.config.cjs" --update-env
          pm2 save

          PORT_VALUE="$(grep -E '^[[:space:]]*PORT[[:space:]]*=' "${BACKEND_DIR}/.env" | tail -n 1 | cut -d= -f2- || true)"
          PORT_VALUE="$(printf '%s' "${PORT_VALUE}" | sed "s/[[:space:]\"']//g")"
          PORT_VALUE="${PORT_VALUE:-4000}"
          HEALTH_URL="http://127.0.0.1:${PORT_VALUE}/api/health"
          HEALTH_OK=0

          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 5 "${HEALTH_URL}" > /tmp/maths-bodhi-health.out 2> /tmp/maths-bodhi-health.err; then
              cat /tmp/maths-bodhi-health.out
              HEALTH_OK=1
              break
            fi

            echo "Backend health check not ready yet (${attempt}/30)."
            sleep 2
          done

          if [ "${HEALTH_OK}" -ne 1 ]; then
            echo "Backend did not answer ${HEALTH_URL} after waiting."
            echo "Last curl error:"
            cat /tmp/maths-bodhi-health.err || true
            echo "PM2 status:"
            pm2 status "${PM2_PROCESS_NAME}" || true
            echo "Recent PM2 logs:"
            pm2 logs "${PM2_PROCESS_NAME}" --lines 80 --nostream || true
            echo "Listening TCP sockets:"
            if command -v ss >/dev/null 2>&1; then
              ss -ltnp || true
            elif command -v netstat >/dev/null 2>&1; then
              netstat -ltnp || true
            fi
            exit 1
          fi

          rm -f "${APP_DIR}/.deploy/source.tgz" "${APP_DIR}/.deploy/backend.env" "${APP_DIR}/.deploy/frontend.env.production"
          REMOTE_SCRIPT

          sshpass -p "${SSH_PASSWORD}" ssh \
            -p "${SSH_PORT}" \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            "${SSH_USER}@${SSH_HOST}" \
            "SERVER_PROJECT_PATH='${SERVER_PROJECT_PATH}' bash -s" < "${remote_script}"
